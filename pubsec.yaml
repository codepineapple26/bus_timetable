      - name: Get dependencies
        run: flutter pub get
        working-directory: bus_timetable

      - name: Build APK
        run: flutter build apk --debug --dart-define=PB_URL=${{ vars.PB_URL }}
        working-directory: bus_timetable

      - uses: actions/upload-artifact@v4
        with:
          name: bus-timetable-debug-apk
          path: bus_timetable/build/app/outputs/flutter-apk/app-debug.apk
