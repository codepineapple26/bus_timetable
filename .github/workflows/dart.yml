name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.example --project-name bus_timetable .
          else
            echo "Android project already exists; keeping its configuration."
          fi

      - name: Upload Android project files
        uses: actions/upload-artifact@v4
        with:
          name: android-scaffold
          path: android/

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: bus-timetable-release-apks
          path: build/app/outputs/flutter-apk/*.apk
