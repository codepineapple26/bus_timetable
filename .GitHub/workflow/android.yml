name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --debug --dart-define=PB_URL=${{ vars.PB_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: bus-timetable-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
